[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml-parallel-tvcache"
version = "0.1.0"
description = "CS5470 Team 39: parallel tool-call TVCache research starter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["parallel_tvcache*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
